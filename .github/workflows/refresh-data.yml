name: Refresh embedded data

# A server that embeds a published table is correct on the day it ships and
# drifts from then on. export-control shipped the 2026-01-01 edition of the
# Commerce Control List and was seven months behind within a release: 9A012 had
# been split so that NS Column 1 no longer covers .a.1, and the server was
# reporting the old scope.
#
# So the generators run on a schedule and open a PR when their source has moved.
# Discovery is by filename, scripts/gen-<name>.mjs against packages/mcp-<name>,
# so a second server with embedded data is covered by writing its generator.
#
# What this job does NOT do is merge. A regenerated federal table is a content
# change to a product whose whole value is being right, and it gets read by a
# human before it ships.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# The PR is created with GITHUB_TOKEN, and GitHub deliberately does not run
# workflows on a PR that a token opened, to stop a workflow triggering itself.
# So this job runs the same checks CI would and reports them in the PR body.
# Read that, not the empty checks list.
#
# `issues: write` is the fallback, and it is load-bearing rather than defensive.
# The `toolstop` org sets "Allow GitHub Actions to create and approve pull
# requests" to off, which is the sensible org default and cannot be overridden
# per repository. Letting that fail the job would wreck the one signal this
# workflow exists to give: a red run means the generator could not read its
# source. A policy toggle and a restructured federal register entry must not
# look the same. So the branch is pushed either way and an issue carries the
# link when the PR cannot be opened.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      generators: ${{ steps.find.outputs.generators }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: node scripts/discover.mjs >> "$GITHUB_OUTPUT"

  refresh:
    needs: discover
    if: needs.discover.outputs.generators != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.generators) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The generator asserts its way through the source and exits non-zero
      # rather than writing a table it could not fully read. An upstream
      # restructure therefore fails this job, which is the alarm: there is no
      # PR to review because there is nothing trustworthy to put in one.
      - name: Regenerate ${{ matrix.package }}
        run: node "scripts/gen-${PKG#mcp-}.mjs"
        env:
          PKG: ${{ matrix.package }}

      - id: diff
        name: What moved
        run: node scripts/data-diff.mjs ${{ matrix.package }} >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::${{ matrix.package }} data is current"

      # A regenerated table that never publishes is a fix nobody receives, and
      # the deploy workflow keys publishing off the version, so the bump belongs
      # in the same PR as the data.
      - id: bump
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/bump-version.mjs ${{ matrix.package }} >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --test packages/${{ matrix.package }}/test.mjs
          node --test packages/_shared/*.test.mjs
          node scripts/tarball-check.mjs ${{ matrix.package }}

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
          VERSION: ${{ steps.bump.outputs.version }}
          SUMMARY: ${{ steps.diff.outputs.summary }}
        run: |
          set -euo pipefail
          BRANCH="data-refresh/$PKG"
          GEN="scripts/gen-${PKG#mcp-}.mjs"

          # Built in a file rather than inline, so YAML block indentation does
          # not end up inside the commit message and the PR body.
          {
            printf '%s\n\n' "$SUMMARY"
            printf 'Regenerated by `%s`. The generator fails rather than writing a table it could not fully read, so this PR existing means it parsed cleanly.\n\n' "$GEN"
            printf '**Verified in the run that opened this PR**, since GitHub does not run workflows on a token-opened PR and the checks list here will stay empty: package tests, shared transport suites, and the packed-and-installed npm tarball answering every tool example.\n\n'
            printf 'Merging deploys the Worker and publishes `%s` to npm and the MCP registry.\n\n' "$VERSION"
            printf '🤖 opened by the refresh-data workflow\n'
          } > /tmp/pr-body.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "packages/$PKG"
          git commit -F - <<EOF
          Refresh $PKG data to the current edition, $VERSION

          $SUMMARY
          EOF

          # Force, because last week's unmerged refresh is superseded by this
          # one rather than something to rebase onto.
          git push --force origin "$BRANCH"

          TITLE="Refresh $PKG data to the current edition, $VERSION"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::updated the open PR for $BRANCH"
            exit 0
          fi

          if gh pr create --head "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md; then
            exit 0
          fi

          # Blocked by the org policy on Actions opening PRs. The work is on the
          # branch regardless, so raise an issue pointing at it rather than
          # failing and making a settings toggle look like a parse failure.
          echo "::warning::could not open a PR; raising an issue instead"
          {
            printf 'The refresh ran and its branch is pushed, but this workflow cannot open the pull request: the org sets **Allow GitHub Actions to create and approve pull requests** to off.\n\n'
            printf 'Open it here: https://github.com/%s/compare/main...%s?expand=1\n\n' "$GITHUB_REPOSITORY" "$BRANCH"
            printf -- '---\n\n'
            cat /tmp/pr-body.md
          } > /tmp/issue-body.md

          EXISTING="$(gh issue list --state open --label data-refresh --search "$PKG in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh label create data-refresh --description "Embedded data is behind its source" --color 0E8A16 2>/dev/null || true
            gh issue create --title "$TITLE" --label data-refresh --body-file /tmp/issue-body.md
          fi
