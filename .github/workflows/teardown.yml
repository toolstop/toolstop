name: Teardown

# One-shot, run by hand on 2026-09-16 when the portfolio was taken down. Stage 1
# of the experiment answered no (see the private strategy repo), and an archived
# server that keeps serving is a live thing nobody maintains. Kept in the tree
# as the record of what was removed and in what order.
#
# Order matters: the listings are marked deleted and the npm packages deprecated
# BEFORE the Workers go, so no directory ever advertises a dead endpoint under
# toolstop.dev. The secrets this uses are deleted from the repo afterwards.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type TEARDOWN to remove every server from the registry, npm and Cloudflare'
        required: true

jobs:
  teardown:
    if: inputs.confirm == 'TEARDOWN'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [mcp-check-digits, mcp-export-control, mcp-prop65]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate to the MCP registry
        run: mcp-publisher login dns --domain toolstop.dev --private-key "$MCP_PRIVATE_KEY"
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      # Not `mcp-publisher status`: 1.8.1 dies with "failed to read response:
      # EOF" against the live registry and changes nothing. The PATCH it was
      # meant to send works when sent by hand with the JWT `login` saved.
      - name: Mark every registry version deleted
        continue-on-error: true   # done on the first successful run; a deleted server 404s
        working-directory: packages/${{ matrix.package }}
        run: |
          NAME="$(node -p 'require("./server.json").name')"
          ENC="$(node -p 'encodeURIComponent(require("./server.json").name)')"
          # Per docs/reference/cli/commands.md in the registry repo.
          TOKEN="$(jq -r .token ~/.config/mcp-publisher/token.json)"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"status":"deleted","statusMessage":"Discontinued 2026-09-16. Source remains at https://github.com/toolstop/toolstop."}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$ENC/status" \
            | jq -r '.servers[] | "\(.server.version) \(._meta["io.modelcontextprotocol.registry/official"].status)"'

      - name: Deprecate the npm package
        continue-on-error: true   # idempotent, but keep the Worker step reachable
        working-directory: packages/${{ matrix.package }}
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          npm deprecate "$NAME@*" "Discontinued 2026-09-16; the hosted endpoint is gone. Source remains at https://github.com/toolstop/toolstop."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Not `wrangler delete`: 4.133 goes through /workers/services, which the
      # deploy token (Workers Scripts:Edit) is refused on with code 10000. The
      # scripts endpoint the deploy itself uses also takes DELETE, and
      # force=true detaches the custom domain with it.
      - name: Delete the Worker and its custom domain
        run: |
          curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/${{ matrix.package }}?force=true" \
            | tee /tmp/out.json | jq -c '{success, errors}'
          jq -e .success /tmp/out.json >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The token id, so it can be found and revoked in the dashboard afterwards.
      - name: Name the Cloudflare token used
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '.result | {id, status}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
