name: CI

# Free on public repos. Every package is discovered automatically, so adding
# server N+1 means creating a directory, with no workflow edit.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
      changed: ${{ steps.find.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: find
        run: node scripts/discover.mjs >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test ${{ matrix.package }}
        run: node --test packages/${{ matrix.package }}/test.mjs

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Transport, validation and the telemetry privacy boundary, plus the two
      # suites that walk packages/mcp-*/ off the filesystem: every tool called
      # through HTTP with its declared examples, and every stdio entrypoint
      # driven as a real child process.
      - run: node --test packages/_shared/*.test.mjs

  # The npm tarball is half this project's distribution and is built by prepack
  # at publish time, so nothing in the repo is the artifact. This packs it,
  # installs it somewhere clean and runs the published bin over stdio, which is
  # the only place the rewritten `../_shared/` imports are ever executed.
  tarball:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pack, install and run ${{ matrix.package }}
        run: node scripts/tarball-check.mjs ${{ matrix.package }}

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Em and en dashes read as machine-written. They are barred everywhere,
      # but the ones that matter are in tool descriptions and instructions,
      # which ship to every client. A doc-only sweep missed those once already.
      - name: No em or en dashes
        run: |
          if git grep -nP '[\x{2013}\x{2014}]' -- . ':!package-lock.json'; then
            echo "::error::em or en dash found; use a comma, colon, semicolon, parentheses, or two sentences"
            exit 1
          fi
